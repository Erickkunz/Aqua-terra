version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: riego_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riego_db}
      POSTGRES_USER: ${POSTGRES_USER:-riego_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riego_pass_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riego_user} -d ${POSTGRES_DB:-riego_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - riego_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riego_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riego_user}:${POSTGRES_PASSWORD:-riego_pass_change_me}@postgres:5432/${POSTGRES_DB:-riego_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    volumes:
      - ./backend:/app
      - uploads_data:/app/static/uploads
    ports:
      - "8000:8000"
    networks:
      - riego_net

  nginx:
    image: nginx:1.27-alpine
    container_name: riego_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/usr/share/nginx/html/static:ro
    networks:
      - riego_net

volumes:
  postgres_data:
  uploads_data:

networks:
  riego_net:
    driver: bridge
