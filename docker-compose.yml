version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: aquaterra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquaterra_db}
      POSTGRES_USER: ${POSTGRES_USER:-aquaterra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose Postgres publicly in production. Keep on internal network only.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaterra_user} -d ${POSTGRES_DB:-aquaterra_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aquaterra_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquaterra_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aquaterra_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aquaterra_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SITE_NAME: ${SITE_NAME:-Aqua-Terra}
      SITE_TAGLINE: ${SITE_TAGLINE:-Soluciones Integrales en Agua y Tierra}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contacto@aquaterra.com}
      CONTACT_PHONE: ${CONTACT_PHONE:-+51 1 234 5678}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aquaterra.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AquaTerra2026!}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-1}
      WEB_WORKERS: ${WEB_WORKERS:-2}
    volumes:
      - uploads_data:/app/static/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - aquaterra_net

  nginx:
    image: nginx:1.27-alpine
    container_name: aquaterra_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # Uncomment to expose HTTPS (mount certs first)
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/usr/share/nginx/html/static:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - aquaterra_net

volumes:
  postgres_data:
  uploads_data:

networks:
  aquaterra_net:
    driver: bridge
