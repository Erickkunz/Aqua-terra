{% extends "admin/_layout.html" %}
{% block admin_title %}{{ item.name if item else 'Nuevo producto' }}{% endblock %}
{% block admin_heading %}{{ 'Editar producto' if item else 'Nuevo producto' }}{% endblock %}

{% block admin_content %}
<form method="post" action="/admin/products/save" class="admin-card form-stack">
  <input type="hidden" name="id" value="{{ item.id if item else '' }}">

  <div class="form-row">
    <label>Nombre <input type="text" name="name" required value="{{ item.name if item else '' }}"></label>
    <label>Categoria
      <select name="category_id" required>
        {% for c in cats %}
        <option value="{{ c.id }}" {% if item and item.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="form-row">
    <label>Precio <input type="number" step="0.01" name="price" value="{{ item.price if item else 0 }}"></label>
    <label>Moneda <input type="text" name="currency" value="{{ item.currency if item else 'USD' }}"></label>
  </div>

  <label>URL imagen <input type="text" name="image_url" value="{{ item.image_url if item else '' }}"></label>
  <label>Descripcion corta <input type="text" name="short_description" value="{{ item.short_description if item else '' }}"></label>
  <label>Descripcion completa <textarea name="description" rows="4">{{ item.description if item else '' }}</textarea></label>

  <div class="form-row">
    <label>Stock cantidad <input type="number" name="stock_qty" value="{{ item.stock_qty if item else 10 }}"></label>
    <label>Rating <input type="number" step="0.1" min="0" max="5" name="rating" value="{{ item.rating if item else 4.5 }}"></label>
  </div>

  <div class="check-inline">
    <label><input type="checkbox" name="in_stock" {% if not item or item.in_stock %}checked{% endif %}> En stock</label>
    <label><input type="checkbox" name="is_featured" {% if item and item.is_featured %}checked{% endif %}> Destacado</label>
  </div>

  <label>Especificaciones (JSON)
    <textarea name="specifications_json" rows="3" style="font-family:monospace;font-size:.85rem">{{ item.specifications|tojson if item else '{}' }}</textarea>
  </label>

  <label>Caracteristicas (JSON array)
    <textarea name="features_json" rows="3" style="font-family:monospace;font-size:.85rem">{{ item.features|tojson if item else '[]' }}</textarea>
  </label>

  <div class="flex-between">
    <a href="/admin/products" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    <button type="submit" class="btn btn-primary btn-glow"><i class="fa-solid fa-save"></i> Guardar</button>
  </div>
</form>
{% endblock %}
