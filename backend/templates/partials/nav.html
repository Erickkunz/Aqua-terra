{% set path = request.url.path %}
<aside class="sidebar" id="sidebar" aria-label="Navegacion principal">
  <div class="sidebar-top">
    <a href="/" class="sidebar-brand" aria-label="{{ site_name }} - inicio">
      <span class="brand-mark"><i class="fa-solid fa-droplet"></i></span>
      <span class="brand-name">{{ site_name }}</span>
    </a>
    <button class="sidebar-collapse-btn" id="sidebarCollapse" aria-label="Colapsar menu" title="Colapsar">
      <i class="fa-solid fa-angles-left"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a href="/" class="sidebar-link {% if path == '/' %}active{% endif %}">
      <i class="fa-solid fa-house"></i><span>Inicio</span>
    </a>
    <a href="/about" class="sidebar-link {% if path == '/about' %}active{% endif %}">
      <i class="fa-solid fa-users-line"></i><span>Nosotros</span>
    </a>

    <div class="sidebar-group">
      <button class="sidebar-link sidebar-group-trigger {% if path.startswith('/pillars') %}active{% endif %}" data-group="pillars" aria-expanded="{% if path.startswith('/pillars') %}true{% else %}false{% endif %}">
        <i class="fa-solid fa-layer-group"></i><span>Pilares</span>
        <i class="fa-solid fa-chevron-down chevron"></i>
      </button>
      <div class="sidebar-submenu {% if path.startswith('/pillars') %}open{% endif %}" data-submenu="pillars">
        <a href="/pillars" class="sidebar-sublink {% if path == '/pillars' %}active{% endif %}">Resumen</a>
        {% for p in pillars %}
        <a href="/pillars/{{ p.slug }}" class="sidebar-sublink {% if path == '/pillars/' ~ p.slug %}active{% endif %}">
          <i class="fa-solid fa-{{ p.icon }}"></i> {{ p.name }}
        </a>
        {% endfor %}
      </div>
    </div>

    <a href="/shop" class="sidebar-link {% if path.startswith('/shop') and not path.startswith('/shop/wishlist') and not path.startswith('/shop/cart') %}active{% endif %}">
      <i class="fa-solid fa-bag-shopping"></i><span>Tienda</span>
    </a>
    <a href="/projects" class="sidebar-link {% if path.startswith('/projects') %}active{% endif %}">
      <i class="fa-solid fa-folder-tree"></i><span>Proyectos</span>
    </a>
    <a href="/blog" class="sidebar-link {% if path.startswith('/blog') %}active{% endif %}">
      <i class="fa-solid fa-newspaper"></i><span>Blog</span>
    </a>
    <a href="/dashboard" class="sidebar-link {% if path.startswith('/dashboard') %}active{% endif %}">
      <i class="fa-solid fa-chart-line"></i><span>Impacto</span>
    </a>
    <a href="/contact" class="sidebar-link {% if path.startswith('/contact') %}active{% endif %}">
      <i class="fa-solid fa-envelope"></i><span>Contacto</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <div class="sidebar-icons">
      <a href="/shop/wishlist" class="sidebar-icon" aria-label="Favoritos" title="Favoritos">
        <i class="fa-regular fa-heart"></i>
        <span class="badge" id="wishlistBadge">{{ wishlist_count }}</span>
      </a>
      <a href="/shop/cart" class="sidebar-icon" aria-label="Carrito" title="Carrito">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge" id="cartBadge">{{ cart_count }}</span>
      </a>
    </div>
    <a href="/contact" class="btn btn-primary btn-block btn-sm sidebar-cta">
      <i class="fa-solid fa-paper-plane"></i><span>Solicitar propuesta</span>
    </a>
  </div>
</aside>

<header class="topbar" id="topbar">
  <button class="topbar-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false">
    <i class="fa-solid fa-bars"></i>
  </button>
  <a href="/" class="topbar-brand">
    <span class="brand-mark"><i class="fa-solid fa-droplet"></i></span>
    <span class="brand-name">{{ site_name }}</span>
  </a>
  <div class="topbar-icons">
    <a href="/shop/wishlist" class="topbar-icon" aria-label="Favoritos">
      <i class="fa-regular fa-heart"></i>
      <span class="badge">{{ wishlist_count }}</span>
    </a>
    <a href="/shop/cart" class="topbar-icon" aria-label="Carrito">
      <i class="fa-solid fa-bag-shopping"></i>
      <span class="badge">{{ cart_count }}</span>
    </a>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
