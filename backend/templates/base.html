<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ site_name }} - {{ site_tagline }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ site_tagline }}. Tecnologia, consultoria, materiales y proyectos internacionales en gestion hidrica.{% endblock %}" />
  <meta name="theme-color" content="#2E75B6" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="stylesheet" href="/static/css/style.css?v=16" />
  <link rel="stylesheet" href="/static/css/responsive.css?v=16" />
  <link rel="stylesheet" href="/static/css/animations.css?v=16" />
  <link rel="stylesheet" href="/static/css/futuristic.css?v=16" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div id="pageOverlay" class="page-overlay" aria-hidden="true">
    <div class="page-overlay-inner">
      <div class="page-overlay-logo">
        <img src="/static/img/logo-mark.svg" alt="">
      </div>
      <div class="page-overlay-spinner"></div>
    </div>
  </div>

  {% include "partials/nav.html" %}

  <div class="app-shell">
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
  </div>

  <a href="#main-content" class="skip-link sr-only">Saltar al contenido</a>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/api.js?v=16"></script>
  <script src="/static/js/main.js?v=16"></script>
  <script src="/static/js/cursor-waves.js?v=16"></script>
  <script src="/static/js/chat-widget.js?v=16" defer></script>
  <script src="/static/js/smooth-ux.js?v=16"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
