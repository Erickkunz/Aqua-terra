{% extends "pillars/_pillar_base.html" %}

{% block pillar_extra %}
<section class="container section">
  <div class="section-head"><span class="eyebrow">Presencia global</span><h2>Donde operamos</h2></div>
  <div id="worldMap" class="world-map" style="height:480px;border-radius:18px;overflow:hidden"></div>
</section>

<section class="section bg-soft">
  <div class="container">
    <div class="section-head"><span class="eyebrow">Socios estrategicos</span><h2>Alianzas internacionales</h2></div>
    <div class="grid grid-4">
      <div class="logo-chip">BID</div>
      <div class="logo-chip">FAO</div>
      <div class="logo-chip">GIZ</div>
      <div class="logo-chip">Banco Mundial</div>
      <div class="logo-chip">PNUD</div>
      <div class="logo-chip">IFC</div>
      <div class="logo-chip">CAF</div>
      <div class="logo-chip">USAID</div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const map = L.map('worldMap', { worldCopyJump: true, scrollWheelZoom: false }).setView([10, -30], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
    const points = [
      ['Peru', -12.0, -77.0],['Mexico', 19.4, -99.1],['Colombia', 4.7, -74.0],['Chile', -33.4, -70.6],
      ['Brasil', -15.8, -47.9],['Espana', 40.4, -3.7],['Marruecos', 31.6, -8.0],['Kenia', -1.3, 36.8],
      ['India', 28.6, 77.2],['Vietnam', 14.0, 108.0],['Argentina', -34.6, -58.4],['Ecuador', -0.2, -78.5]
    ];
    points.forEach(([n,lat,lng]) => L.marker([lat,lng]).addTo(map).bindPopup('<strong>'+n+'</strong>'));
  });
</script>
{% endblock %}
