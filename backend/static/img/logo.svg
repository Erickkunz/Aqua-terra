<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Aqua-Terra logo">
  <defs>
    <linearGradient id="aqua-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DD9D6"/>
      <stop offset="55%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
    <linearGradient id="terra-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9BD66A"/>
      <stop offset="60%" stop-color="#70AD47"/>
      <stop offset="100%" stop-color="#4F7F32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DD9D6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3DD9D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="128" cy="128" r="118" fill="url(#glow)"/>

  <!-- outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#aqua-grad)" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="url(#terra-grad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- droplet (Aqua) -->
  <path d="M128 36
           C 168 86, 196 122, 196 156
           a 68 68 0 0 1 -136 0
           C 60 122, 88 86, 128 36 Z"
        fill="url(#aqua-grad)"
        filter="url(#soft)"/>

  <!-- droplet highlight -->
  <path d="M104 130
           C 100 110, 112 88, 132 76"
        stroke="white" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- terra leaf overlay -->
  <path d="M128 130
           C 148 116, 178 116, 196 134
           C 188 168, 162 188, 132 184
           C 124 168, 122 150, 128 130 Z"
        fill="url(#terra-grad)" fill-opacity="0.92"/>

  <!-- leaf vein -->
  <path d="M134 178 C 150 162, 168 144, 188 138"
        stroke="white" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- micro waves under -->
  <g stroke="#3DD9D6" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M60 214 q 14 -10 28 0 t 28 0 t 28 0 t 28 0 t 28 0"/>
    <path d="M70 226 q 12 -8 24 0 t 24 0 t 24 0 t 24 0" stroke-opacity="0.35"/>
  </g>
</svg>
